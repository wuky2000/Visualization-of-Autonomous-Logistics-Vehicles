name: Publish product website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static files
        run: |
          mkdir -p _site/downloads
          cp index.html .nojekyll _site/
          cp downloads/logistics_vehicle_website.html downloads/logistics_vehicle_website.zip _site/downloads/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live website and downloads
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "${SITE_URL%/}/" --output /tmp/published-index.html
          cmp index.html /tmp/published-index.html
          curl --fail --location --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "${SITE_URL%/}/downloads/logistics_vehicle_website.html" --output /tmp/published-offline.html
          cmp downloads/logistics_vehicle_website.html /tmp/published-offline.html
          curl --fail --location --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "${SITE_URL%/}/downloads/logistics_vehicle_website.zip" --output /tmp/published-offline.zip
          cmp downloads/logistics_vehicle_website.zip /tmp/published-offline.zip
